services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: apcontrol
      POSTGRES_USER: apcontrol
      POSTGRES_PASSWORD: apcontrol
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apcontrol -d apcontrol"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://apcontrol:apcontrol@db:5432/apcontrol
      JWT_SECRET: change-this-secret-before-production
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "8000:8000"

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
